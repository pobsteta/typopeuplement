[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typopeuplement"
version = "0.1.0"
description = "Typologie automatique des peuplements forestiers par sylvoécorégion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
typopeuplement = "typopeuplement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
