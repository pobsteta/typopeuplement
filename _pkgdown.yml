url: https://pobsteta.github.io/typopeuplement/
# Le dossier docs/ du dépôt porte la documentation du projet (brief, ADR) : le site se construit ailleurs.
destination: site
template:
  bootstrap: 5
lang: fr

# Site pkgdown de typopeuplement (mission 015). Publié par .github/workflows/pages.yml,
# seulement depuis `main`. L'article des résultats tourne sur le jeu synthétique tant que
# les livrables de Léoncel ne sont pas calculés : il le dit en tête.

navbar:
  structure:
    left: [intro, reference, articles]
  components:
    articles:
      text: Articles
      menu:
        - text: "Résultats sur l'AOI pilote"
          href: articles/resultats-aoi-pilote.html

articles:
  - title: Résultats
    navbar: ~
    contents:
      - starts_with("articles/resultats")

reference:
  - title: "Point d'entrée et démonstration"
    contents:
      - typopeuplement-package
      - typer_peuplements
      - lancer_demo
      - generer_jeu_synthetique
      - ecrire_livrables
  - title: "Rapport de l'AOI (Quarto, targets)"
    desc: "Cartes des types, couche de confiance, état de preuve, limites."
    contents:
      - cibles_rapport
      - rendre_rapport
      - tables_rapport
      - etat_de_preuve
      - limites_rapport
      - modele_rapport
